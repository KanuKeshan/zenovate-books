databases:
  - name: zenovatebooks-db
    plan: free
    databaseName: zenovatebooks
    user: zenovatebooks

services:
  - type: web
    name: zenovatebooks-test
    runtime: node
    plan: free
    # devDependencies (typescript) are needed to compile, so install them explicitly.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/auth/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "true"
      - key: LOG_LEVEL
        value: info
      # Render hands the app the database's private-network address, so traffic
      # never crosses the public internet and PGSSL is deliberately left unset.
      - key: DATABASE_URL
        fromDatabase:
          name: zenovatebooks-db
          property: connectionString
      # Secrets: entered in the Render dashboard, never committed.
      - key: LOCAL_AUTH_SECRET
        sync: false
      - key: LOCAL_AUTH_USERS
        sync: false
